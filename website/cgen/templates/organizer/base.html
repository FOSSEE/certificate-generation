<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cgen Organizer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <style>
    main { overflow-wrap: anywhere; }
    main img, main iframe, main video { max-width: 100%; height: auto; }
    /* Page header rows: title on top, buttons below when there's no room */
    .page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .75rem; }
    .page-head .actions { display: flex; flex-wrap: wrap; gap: .5rem; }
    /* Form buttons: comfortable spacing when they wrap */
    form .btn + .btn, form .btn + a.btn { margin-left: .25rem; }
    @media (max-width: 575.98px) {
      h2 { font-size: 1.5rem; }
      .card.p-4 { padding: 1rem !important; }
      form .btn + .btn, form .btn + a.btn { margin-left: 0; }
      form > .btn, form > a.btn { width: 100%; margin-top: .5rem; }
      .participants-table td { min-width: 9rem; }
    }
  </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container flex-nowrap">
    <a class="navbar-brand" href="{% url 'organizer_dashboard' %}">
      Cgen Organizer
    </a>

    <div class="ms-auto text-white d-flex align-items-center gap-2" style="min-width: 0">
      {% if request.user.is_authenticated %}
        <span class="text-truncate d-none d-sm-inline">{{ request.user.username }}</span>
        <a href="{% url 'organiser_logout' %}" class="btn btn-sm btn-outline-light flex-shrink-0">
          Logout
        </a>
      {% endif %}
    </div>
  </div>
</nav>

<main class="container py-4">

  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }}">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}

</main>

</body>
</html>
