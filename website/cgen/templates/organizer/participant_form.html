{% extends "organizer/base.html" %}

{% block content %}

<h2>Edit Participant</h2>

<p class="text-muted">
  Certificate: {{ certificate.description }}
</p>

<form method="post" class="card shadow-sm p-4">
  {% csrf_token %}

  <div class="mb-3">
    <label class="form-label">Email</label>
    <input
      type="email"
      name="email"
      value="{{ email }}"
      class="form-control"
      required
    >
  </div>

  <div class="mb-3">
    <label class="form-label">Details JSON</label>
    <textarea
      name="details"
      rows="10"
      class="form-control"
      required
    >{{ details_text }}</textarea>

    <div class="form-text">
      Example:
      <code>{"name": "Ram", "institute": "IIT Bombay"}</code>
    </div>
  </div>

  <button type="submit" class="btn btn-primary">
    Save Participant
  </button>

  <a href="{% url 'participants' certificate.id %}" class="btn btn-secondary">
    Cancel
  </a>
</form>

{% endblock %}
