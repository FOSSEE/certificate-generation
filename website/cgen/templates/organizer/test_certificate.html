{% extends "organizer/base.html" %}

{% block content %}

<h2>Test Certificate Generation</h2>

<p class="text-muted">
  Certificate: {{ certificate.description }}
</p>

<div class="card shadow-sm p-4">
  {% if participants %}
    <form method="post">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Select Participant</label>

        <select name="participant" class="form-select" required>
          <option value="">Choose participant</option>

          {% for participant in participants %}
            <option value="{{ participant.id }}">
              {{ participant.email }}{% if participant.details.name %} — {{ participant.details.name }}{% endif %}
            </option>
          {% endfor %}
        </select>
      </div>

      <button type="submit" class="btn btn-success">
        Generate Test Certificate
      </button>

      <a href="{% url 'event_detail' certificate.event.id %}" class="btn btn-secondary">
        Back
      </a>
    </form>
  {% else %}
    <div class="alert alert-warning">
      No participants uploaded yet. Upload participants before testing.
    </div>

    <a href="{% url 'upload_csv_participants' certificate.id %}" class="btn btn-primary">
      Upload Participants
    </a>
  {% endif %}
</div>

{% endblock %}
