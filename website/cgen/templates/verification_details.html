{% extends 'base.html' %}

{% block header%}
    Certificate Verification
{% endblock %}
{% block content %}
    <div class="row justify-content-center">
    <div class="col-12 col-md-10 col-lg-8">
    {% if has_details %}
    <div>
        <p class="mb-2"> Following are the details</p>
        <div class="table-responsive">
        <table class="table table-primary table-bordered mb-3" >
            <tbody>
                {% for key, value in details.items %}
                <tr>
                    <th scope="row" class="fw-semibold" style="width: 35%">{{ key | title  }}</th>
                    <td>{{ value }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        </div>
        <div class="bg-white p-3 rounded">
        {{ description | safe }}
        </div>
    </div>

    {% endif %}
    </div>
    </div>
{% endblock %}
